version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "sql/queries/"
    gen:
      go:
        package: "repository"
        out: "internal/platform/database/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_exact_table_names: true
